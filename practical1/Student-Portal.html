<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Portal</title>
</head>

<body>
    <!-- Semantic Header -->
    <header>
        <h1>Student Portal</h1>
        <p>Welcome to the Student Portal</p>

    </header>
    <!-- 2. Semantic Navigation -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#register">Register</a></li>
            <li><a href="#media">Media</a></li>
            <li><a href="#profile">Profile</a></li>
        </ul>
    </nav>
    <!-- 3. Semantic Section -->
    <section id="home">
        <h2>About the Student Portal</h2>
        <p>This is a simple student portal for managing your academic information.</p>
        <img src="images/lpu.webp" alt="image " />
    </section>
    <section id="register">
        <h2>Register</h2>
        <form action="register.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" minlength="8" required><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <fieldset>
                <legend>Gender:</legend>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </fieldset><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label><br><br>

            <button type="submit" value="Register">
                Register
            </button>
            <button type="reset" value="Reset">
                Reset
            </button>
        </form>
    </section>

    <section id="media">
        <h2>Media</h2>
        <p>Check out our media resources.</p>
        <video width="300" controls>
            <source src="video/sample-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h3>Audio</h3>
        <audio controls>
            <source src="audio/sample-audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>
</body>

</html>
